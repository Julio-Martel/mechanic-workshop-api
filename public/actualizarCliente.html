<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
      
    <title>Actualizar cliente</title>
</head>
<body>
    <div>
        <div>
            <h1>Actualizacion de cliente</h1>
        </div>
        <div>
            <form class="form-class">
                <label for="id-cliente">ID Cliente:</label>
                <input type="number" id="id-cliente" placeholder="Ingrese ID" min="1">
                
                <label for="nom-cliente">Nombre:</label>
                <input type="text" id="nom-cliente" placeholder="Ingrese nombre">

                <label for="ape-cliente">Apellido:</label>
                <input type="text" id="ape-cliente" placeholder="Ingrese apellido">

                <label for="dni-cliente">DNI:</label>
                <input type="text" id="dni-cliente" placeholder="Ingrese DNI">

                <label for="tel-cliente">Telefono:</label>
                <input type="tel" id="tel-cliente" placeholder="Ingrese telefono">

                <label for="em-cliente">Email:</label>
                <input type="email" id="em-cliente" placeholder="Ingrese email">
            </form>

            <button>Aceptar</button>
        </div>
    
    </div>

</body> 
</html>
